<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoFlie Admin v2</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    color:#fff;
    font-family:Arial,sans-serif;
    max-width:1100px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:20px;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    flex-wrap:wrap;
    gap:10px;
}

.total{
    font-size:18px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    margin:8px 0;
    background:#222;
    color:#fff;
    border:1px solid #444;
    border-radius:6px;
}

button{
    padding:10px 16px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    color:#fff;
}

.add{
    background:#00c853;
}

.copy{
    background:#1565c0;
}

.edit{
    background:#ff9800;
}

.delete{
    background:#d50000;
}

.refresh{
    background:#555;
}

table{
    width:100%;
    margin-top:20px;
    border-collapse:collapse;
}

th,td{
    border:1px solid #333;
    padding:10px;
    text-align:left;
}

th{
    background:#222;
}

a{
    color:#00e5ff;
    text-decoration:none;
}

.search{
    margin-top:10px;
}

@media(max-width:768px){

table{
    display:block;
    overflow-x:auto;
}

}

</style>

</head>

<body>

<h1>GoFlie Admin v2</h1>

<div class="top">

<div class="total">
Total Links :
<span id="total">0</span>
</div>

<button class="refresh" onclick="load()">
Refresh
</button>

</div>

<input
id="search"
class="search"
placeholder="Search slug..."
onkeyup="searchLinks()">

<input
id="url"
placeholder="https://example.com">

<button
class="add"
onclick="create()">
➕ Add Link
</button>

<table>

<thead>

<tr>

<th>Slug</th>

<th>Original URL</th>

<th>Action</th>

</tr>

</thead>

<tbody id="list">

</tbody>

</table>

<script>

const API="https://goflie.xyz";

function randomSlug(length=6){

const chars="abcdefghijklmnopqrstuvwxyz0123456789";

let slug="";

for(let i=0;i<length;i++){

slug+=chars[Math.floor(Math.random()*chars.length)];

}

return slug;

}

let links=[];

async function load(){

const res=await fetch(API+"/api/list");

links=await res.json();

document.getElementById("total").innerText=links.length;

render(links);

}

function render(data){

document.getElementById("list").innerHTML=data.map(x=>`

<tr>

<td>${x.slug}</td>

<td>
<a href="${x.original_url}" target="_blank">
${x.original_url}
</a>
</td>

<td>

<button class="copy"
onclick="copyLink('${x.slug}')">
Copy
</button>

<button class="edit"
onclick="editLink('${x.slug}','${x.original_url}')">
Edit
</button>

<button class="delete"
onclick="removeLink('${x.slug}')">
Delete
</button>

</td>

</tr>

`).join("");

}

function searchLinks(){

const keyword=document.getElementById("search").value.toLowerCase();

const result=links.filter(x=>

x.slug.toLowerCase().includes(keyword) ||

x.original_url.toLowerCase().includes(keyword)

);

render(result);

}

async function create(){

const url=document.getElementById("url").value.trim();

if(!url){

alert("Please enter URL");

return;

}

const slug=randomSlug();

await fetch(API+"/api/create",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

slug:slug,

url:url

})

});

document.getElementById("url").value="";

load();

}

async function editLink(slug,oldUrl){

const newUrl=prompt("Edit URL",oldUrl);

if(!newUrl) return;

await fetch(API+"/api/update",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

slug:slug,

url:newUrl

})

});

load();

}

async function removeLink(slug){

if(!confirm("Delete "+slug+" ?")) return;

await fetch(API+"/api/delete/"+slug);

load();

}

function copyLink(slug){

const link="https://goflie.xyz/"+slug;

navigator.clipboard.writeText(link);

alert("Copied:\n"+link);

}

load();

</script>

</body>
</html>
