<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoFlie Admin v2</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    color:#fff;
    font-family:Arial,sans-serif;
    max-width:1100px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:20px;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    flex-wrap:wrap;
    gap:10px;
}

.total{
    font-size:18px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    margin:8px 0;
    background:#222;
    color:#fff;
    border:1px solid #444;
    border-radius:6px;
}

button{
    padding:10px 16px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    color:#fff;
}

.add{
    background:#00c853;
}

.copy{
    background:#1565c0;
}

.edit{
    background:#ff9800;
}

.delete{
    background:#d50000;
}

.refresh{
    background:#555;
}

table{
    width:100%;
    margin-top:20px;
    border-collapse:collapse;
}

th,td{
    border:1px solid #333;
    padding:10px;
    text-align:left;
}

th{
    background:#222;
}

a{
    color:#00e5ff;
    text-decoration:none;
}

.search{
    margin-top:10px;
}

@media(max-width:768px){

table{
    display:block;
    overflow-x:auto;
}

}

</style>

</head>

<body>

<h1>GoFlie Admin v2</h1>

<div class="top">

<div class="total">
Total Links :
<span id="total">0</span>
</div>

<button class="refresh" onclick="load()">
Refresh
</button>

</div>

<input
id="search"
class="search"
placeholder="Search slug..."
onkeyup="searchLinks()">

<input
id="url"
placeholder="https://example.com">

<button
class="add"
onclick="create()">
➕ Add Link
</button>

<table>

<thead>

<tr>

<th>Slug</th>

<th>Original URL</th>

<th>Action</th>

</tr>

</thead>

<tbody id="list">

</tbody>

</table>

<!-- Part 2 (JavaScript) នឹងដាក់នៅទីនេះ -->

</body>
</html>
