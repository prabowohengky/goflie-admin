<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoFlie Admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>GoFlie Admin Dashboard</h1>

    <div class="card">
        <input id="slug" placeholder="Slug">
        <input id="url" placeholder="Original URL">
        <button onclick="createLink()">Create</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Slug</th>
                <th>Original URL</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="links"></tbody>
    </table>
</div>

<script src="app.js"></script>

</body>
</html>
